[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thememory"
version = "0.1.0"
description = "Background long-term memory layer for Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "kymjs" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
thememory = "thememory.cli.main:main"
thememoryd = "thememory.daemon.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thememory"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["thememory"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "posix: tests that require POSIX sockets or fcntl",
    "windows: tests that require Windows IPC path",
]
