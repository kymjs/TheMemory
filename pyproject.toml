[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thememory"
version = "0.1.0"
description = "Background long-term memory layer for Agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "kymjs" }]
dependencies = [
    "numpy>=1.26",
    # 1.20+ dropped Intel macOS wheels; keep 1.19.x until ORT restores them.
    "onnxruntime>=1.17,<1.20; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "onnxruntime>=1.17; platform_system != 'Darwin' or platform_machine != 'x86_64'",
    "httpx>=0.27",
    "mcp>=1.0,<2",
    "tokenizers>=0.20",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
thememory = "thememory.cli.main:main"
thememoryd = "thememory.daemon.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thememory"]

[tool.hatch.build.targets.wheel.force-include]
"src/thememory/storage/migrations/001_initial.sql" = "thememory/storage/migrations/001_initial.sql"
"src/thememory/storage/migrations/001_turns.sql" = "thememory/storage/migrations/001_turns.sql"
"src/thememory/storage/migrations/002_session_flags.sql" = "thememory/storage/migrations/002_session_flags.sql"
"src/thememory/ui/page.html" = "thememory/ui/page.html"
"src/thememory/ui/providers.json" = "thememory/ui/providers.json"
"src/thememory/installer/hermes_plugin/plugin.yaml" = "thememory/installer/hermes_plugin/plugin.yaml"
"src/thememory/installer/hermes_plugin/__init__.py" = "thememory/installer/hermes_plugin/__init__.py"
"src/thememory/eval/fixtures/retrieval_zh.json" = "thememory/eval/fixtures/retrieval_zh.json"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-networkx",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["thememory"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "onnxruntime.*",
    "tokenizers.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "posix: tests that require POSIX sockets or fcntl",
    "windows: tests that require Windows IPC path",
    "slow: downloads or long-running integration",
]
